<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Preview</title>
<style>
  :root{ --gold:#d4af37; --cream:#f4efe3; --muted:#9a9587; --green:#3fae5c; --red:#e0393e; }
  *{box-sizing:border-box;}
  body{ margin:0; background:#2a2a2a; font-family:-apple-system,Segoe UI,Roboto,sans-serif; display:flex; justify-content:center; padding:24px; }
  .phone{ width:360px; height:720px; background:#000; border-radius:28px; overflow:hidden; position:relative; box-shadow:0 10px 30px rgba(0,0,0,.5); border:6px solid #111; }
  .cam-top{ height:52%; background:linear-gradient(160deg,#4a4a4a,#222); position:relative; }
  .cam-top .top-bar{ position:absolute; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:8px; }
  .live-badge{ background:#e0393e; color:#fff; font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; }
  .heart-badge{ background:rgba(255,255,255,.2); color:#fff; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .viewer-badge{ background:rgba(255,255,255,.2); color:#fff; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; margin-left:auto; }
  .close-x{ width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.2); color:#fff; text-align:center; line-height:26px; font-size:13px; }

  /* ===== exact classes copied from index.html ===== */
  .live-guest-requests{
    position:relative; left:0; right:0; bottom:0; z-index:65; background:#12100c;
    border-top-left-radius:20px; border-top-right-radius:20px; padding:10px 16px 18px;
    height:48%; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,0.35);
  }
  .lgr-sheet-handle{ width:38px; height:4px; border-radius:4px; background:rgba(244,239,227,0.35); margin:2px auto 10px; }
  .lgr-sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .lgr-sheet-title{ font-weight:800; color:var(--cream); font-size:0.95rem; }
  .lgr-sheet-close{ background:none; border:none; color:var(--muted); font-size:1.2rem; line-height:1; padding:4px 8px; }
  .lgr-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 2px; font-size:0.82rem; color:var(--cream);}
  .lgr-empty{color:var(--muted); font-size:0.8rem; text-align:center; padding:6px 0;}
  .lgr-section-title{font-size:0.72rem; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:0.04em; margin:12px 0 4px;}
  .lgr-section-title:first-child{margin-top:0;}
  .lgr-tabs{display:flex; gap:8px; margin:4px 0 10px;}
  .lgr-tab{flex:1; padding:8px; border-radius:10px; border:1px solid rgba(244,239,227,0.15); background:none; color:var(--muted); font-size:0.8rem; font-weight:700;}
  .lgr-tab.active{background:rgba(212,175,55,0.15); border-color:rgba(212,175,55,0.5); color:var(--gold);}
  .lgr-people-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; }
  .lgr-avatar{
    width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--gold),#8a6d1f);
    color:#1a1509; font-weight:800; font-size:0.9rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .lgr-people-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .lgr-people-info b{ font-size:0.85rem; color:var(--cream); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lgr-host-tag{ font-size:0.65rem; color:var(--gold); font-weight:700; margin-top:1px; }
  .lgr-people-mod, .lgr-people-remove{ width:28px; height:28px; border-radius:50%; border:none; font-size:0.78rem; flex-shrink:0; }
  .lgr-people-mod{ background:rgba(212,175,55,0.18); color:var(--gold); }
  .lgr-people-remove{ background:rgba(230,90,90,0.25); color:#ff9d9d; margin-left:4px; }
  .lgr-guests-header{ display:flex; align-items:center; justify-content:space-between; }
  .lgr-add-guests-link{ background:none; border:none; color:var(--red); font-size:0.76rem; font-weight:700; }
  .lgr-icon-row{ display:flex; justify-content:space-around; margin-top:14px; padding-top:12px; border-top:1px solid rgba(244,239,227,0.1); }
  .lgr-icon-btn{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--cream); font-size:0.68rem; }
  .lgr-icon-btn span{ font-size:1.1rem; }
</style>
</head>
<body>
  <div class="phone">
    <div class="cam-top">
      <div class="top-bar">
        <span class="live-badge">🔴 LIVE</span>
        <span class="heart-badge">❤️ 30</span>
        <span class="viewer-badge">👁 12</span>
        <span class="close-x">✕</span>
      </div>
    </div>
    <div class="live-guest-requests">
      <div class="lgr-sheet-handle"></div>
      <div class="lgr-sheet-header">
        <span class="lgr-sheet-title">Hangout with guests</span>
        <button class="lgr-sheet-close">✕</button>
      </div>
      <div class="lgr-tabs">
        <button class="lgr-tab">📦 Invite</button>
        <button class="lgr-tab active">🛡 Manage</button>
      </div>

      <div class="lgr-section-title">👥 In this LIVE</div>
      <div class="lgr-people-row">
        <div class="lgr-avatar">S</div>
        <div class="lgr-people-info"><b>Said 100 (You)</b><span class="lgr-host-tag">Host</span></div>
      </div>

      <div class="lgr-guests-header">
        <span class="lgr-section-title" style="margin:10px 0 4px;">Guests (2)</span>
        <button class="lgr-add-guests-link">+ Add guests</button>
      </div>
      <div class="lgr-people-row">
        <div class="lgr-avatar">A</div>
        <div class="lgr-people-info"><b>Abebe Getahun</b><span class="lgr-host-tag">🛡 Mod</span></div>
        <button class="lgr-people-mod">🛡</button>
        <button class="lgr-people-remove">✕</button>
      </div>
      <div class="lgr-people-row">
        <div class="lgr-avatar">S</div>
        <div class="lgr-people-info"><b>Selam Tesfaye</b></div>
        <button class="lgr-people-mod">🛡</button>
        <button class="lgr-people-remove">✕</button>
      </div>

      <div class="lgr-section-title">🙋 Join Requests</div>
      <div class="lgr-row"><span>Fatuma Ahmed</span><span style="color:var(--muted)">pending…</span></div>

      <div class="lgr-icon-row">
        <button class="lgr-icon-btn"><span>➕</span>Invite guests</button>
        <button class="lgr-icon-btn"><span>🔇</span>Mute all</button>
        <button class="lgr-icon-btn"><span>⊞</span>Room layout</button>
      </div>
    </div>
  </div>
</body>
</html>
