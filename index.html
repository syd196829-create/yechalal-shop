<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yechalal Shop - ይቻላል ሾፕ | የኢትዮጵያ የመጀመሪያው የቪዲዮ ማርኬትፕሌስ</title>

    <!-- SEO & Social Sharing Metadata -->
    <meta name="description" content="በቪዲዮ፣ በቀጥታ ስርጭት እና በዘመናዊ መንገድ የሚሸጡበት እና የሚገዙበት የኢትዮጵያ የመጀመሪያው የቪዲዮ ማርኬትፕሌስ">
    <meta name="keywords" content="ይቻላል ሾፕ, Yechalal Shop, Ethiopian Video Shopping, Live Streaming, E-commerce Ethiopia">
    <meta name="author" content="Yechalal Shop Team">

    <!-- Open Graph / Facebook / Telegram -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Yechalal Shop - ይቻላል ሾፕ">
    <meta property="og:description" content="በቪዲዮ እና በቀጥታ ስርጭት የሚገዙበትና የሚሸጡበት የሶሻል ማርኬትፕሌስ መድረክ">
    <meta property="og:image" content="https://yechalal-shop.vercel.app/og-image.jpg">
    <meta property="og:url" content="https://yechalal-shop.vercel.app/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Yechalal Shop - ይቻላል ሾፕ">
    <meta name="twitter:description" content="በቪዲዮ እና በቀጥታ ስርጭት የሚገዙበትና የሚሸጡበት መድረክ">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Yechalal Shop",
      "url": "https://yechalal-shop.vercel.app/",
      "logo": "https://yechalal-shop.vercel.app/logo.png",
      "description": "የኢትዮጵያ የመጀመሪያው የቪዲዮ እና የቀጥታ ስርጭት ማርኬትፕሌስ"
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #f59e0b;
            --danger: #ef4444;
            --border-color: #334155;
            --font-family: 'Noto Sans Ethiopic', 'Poppins', sans-serif;
            --bottom-nav-height: 65px;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Mobile Container Simulation */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* HEADER */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* MAIN FEED (TikTok Vertical Scroll Style) */
        .feed-container {
            flex: 1;
            overflow-y: scroll;
            snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        .feed-item {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feed-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay Details */
        .video-overlay {
            position: absolute;
            bottom: calc(var(--bottom-nav-height) + 16px);
            left: 16px;
            right: 70px;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .seller-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .seller-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .seller-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.88rem;
            color: #e2e8f0;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .buy-now-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .buy-now-btn:active {
            transform: scale(0.95);
        }

        /* Right Side Actions Bar */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: calc(var(--bottom-nav-height) + 30px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: #ffffff;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 4px;
            backdrop-filter: blur(4px);
        }

        .action-btn.active {
            color: var(--danger);
        }

        /* BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 0.75rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: none;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-icon {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .add-post-btn {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            border: none;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            margin-top: -15px;
            cursor: pointer;
        }

        /* MODAL POPUPS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-sub);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="logo-title">ይቻላል ሾፕ</h1>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" aria-label="ጭብጥ ቀይር">🌙</button>
                <button class="icon-btn" aria-label="የቀጥታ ስርጭት ይጀምሩ">🎥</button>
                <button class="icon-btn" aria-label="ካሜራ ክፈት">📷</button>
            </div>
        </header>

        <!-- Video & Product Feed -->
        <main class="feed-container">
            <!-- Feed Item 1 -->
            <section class="feed-item">
                <img src="https://picsum.photos/400/800?random=1" alt="የምርት ማሳያ" loading="lazy" class="feed-img">
                
                <div class="video-overlay">
                    <div class="seller-info">
                        <img src="https://i.pravatar.cc/100?img=33" alt="የሻጭ ፕሮፋይል" class="seller-avatar" loading="lazy">
                        <span class="seller-name">አበበ ፋሽን</span>
                    </div>
                    <h2 class="product-title">ዘመናዊ የሀበሻ ቀሚስ</h2>
                    <div class="product-price">3,500 ብር</div>
                    <p class="product-desc">በጥራት የተሰፋ፣ ለበዓላት እና ለተለያዩ ፕሮግራሞች የሚሆን አዲስ ዲዛይን።</p>
                    <button class="buy-now-btn" onclick="openBuyModal('ዘመናዊ የሀበሻ ቀሚስ', '3,500 ብር')">አሁኑኑ ይግዙ</button>
                </div>

                <aside class="side-actions">
                    <div class="action-item" onclick="toggleLike(this)">
                        <button class="action-btn" aria-label="ውደድ">❤️</button>
                        <span>1.2K</span>
                    </div>
                    <div class="action-item" onclick="openCommentModal()">
                        <button class="action-btn" aria-label="አስተያየት መስጫ">💬</button>
                        <span>342</span>
                    </div>
                    <div class="action-item">
                        <button class="action-btn" aria-label="ስጦታ ስጥ">🎁</button>
                        <span>ኮይን</span>
                    </div>
                    <div class="action-item">
                        <button class="action-btn" aria-label="አጋራ">ይጋሩ</button>
                        <span>Share</span>
                    </div>
                </aside>
            </section>

            <!-- Feed Item 2 -->
            <section class="feed-item">
                <img src="https://picsum.photos/400/800?random=2" alt="የምርት ማሳያ 2" loading="lazy" class="feed-img">
                
                <div class="video-overlay">
                    <div class="seller-info">
                        <img src="https://i.pravatar.cc/100?img=12" alt="የሻጭ ፕሮፋይል" class="seller-avatar" loading="lazy">
                        <span class="seller-name">ቴክኖ ኢትዮጵያ</span>
                    </div>
                    <h2 class="product-title">ስማርት ሰዓት (Smart Watch)</h2>
                    <div class="product-price">2,200 ብር</div>
                    <p class="product-desc">የልብ ምት፣ የእንቅልፍ ሁኔታ እና የስፖርት እንቅስቃሴዎችን የሚከታተል</p>
                    <button class="buy-now-btn" onclick="openBuyModal('ስማርት ሰዓት', '2,200 ብር')">አሁኑኑ ይግዙ</button>
                </div>

                <aside class="side-actions">
                    <div class="action-item" onclick="toggleLike(this)">
                        <button class="action-btn" aria-label="ውደድ">❤️</button>
                        <span>850</span>
                    </div>
                    <div class="action-item" onclick="openCommentModal()">
                        <button class="action-btn" aria-label="አስተያየት መስጫ">💬</button>
                        <span>120</span>
                    </div>
                    <div class="action-item">
                        <button class="action-btn" aria-label="ስጦታ ስጥ">🎁</button>
                        <span>ኮይን</span>
                    </div>
                    <div class="action-item">
                        <button class="action-btn" aria-label="አጋራ">ይጋሩ</button>
                        <span>Share</span>
                    </div>
                </aside>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" aria-label="መነሻ ገጽ">
                <span class="nav-icon">🏠</span>
                <span>መነሻ</span>
            </button>
            <button class="nav-item" aria-label="ቀጥታ ስርጭቶች">
                <span class="nav-icon">🔴</span>
                <span>Live</span>
            </button>
            <button class="add-post-btn" aria-label="አዲስ ቪዲዮ/ምርት ልቀቅ">+</button>
            <button class="nav-item" aria-label="መልእክቶች">
                <span class="nav-icon">💬</span>
                <span>መልእክት</span>
            </button>
            <button class="nav-item" aria-label="የግል ማውጫ">
                <span class="nav-icon">👤</span>
                <span>ፕሮፋይል</span>
            </button>
        </nav>

        <!-- Buy Modal -->
        <div class="modal" id="buyModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalProductTitle">ምርት ይግዙ</h3>
                    <button class="close-btn" onclick="closeModal('buyModal')">&times;</button>
                </div>
                <p id="modalProductPrice" style="color: var(--accent); font-weight: bold; margin-bottom: 10px;"></p>
                <p style="margin-bottom: 15px; color: var(--text-sub);">የመክፈያ ዘዴ ይምረጡ፡</p>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="buy-now-btn" style="background: #0052cc;" onclick="alert('በTelebirr ክፍያ በመፈጸም ላይ...')">Telebirr (ቴሌብር)</button>
                    <button class="buy-now-btn" style="background: #22c55e;" onclick="alert('በCBE Birr ክፍያ በመፈጸም ላይ...')">CBE Birr</button>
                </div>
            </div>
        </div>

        <!-- Comment Modal -->
        <div class="modal" id="commentModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>አስተያየቶች</h3>
                    <button class="close-btn" onclick="closeModal('commentModal')">&times;</button>
                </div>
                <div style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;">
                    <p style="margin-bottom: 8px;"><strong>ሰሎሞን:</strong> በጣም ያምራል!</p>
                    <p style="margin-bottom: 8px;"><strong>ማርታ:</strong> አድራሻ ወዴት ነው?</p>
                </div>
                <input type="text" placeholder="አስተያየት ይጻፉ..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main);">
            </div>
        </div>

    </div>

    <!-- JavaScript Handlers -->
    <script>
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.body.removeAttribute('data-theme');
                themeToggle.textContent = '🌙';
            } else {
                document.body.setAttribute('data-theme', 'light');
                themeToggle.textContent = '☀️';
            }
        });

        // Like Toggle
        function toggleLike(element) {
            const btn = element.querySelector('.action-btn');
            btn.classList.toggle('active');
        }

        // Modal Handlers
        function openBuyModal(title, price) {
            document.getElementById('modalProductTitle').textContent = title;
            document.getElementById('modalProductPrice').textContent = price;
            document.getElementById('buyModal').classList.add('open');
        }

        function openCommentModal() {
            document.getElementById('commentModal').classList.add('open');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
        }
    </script>
</body>
</html>
